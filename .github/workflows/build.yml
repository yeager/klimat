name: Build desktop installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            bundles: deb,rpm
          - os: macos-15-intel
            target: macos-x64
            bundles: dmg
          - os: macos-15
            target: macos-arm64
            bundles: dmg
          - os: windows-latest
            target: windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm wget

      - name: Install Python adapter and freezer dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build bundled climate adapter
        run: |
          python src-tauri/python/collect_licenses.py
          python -m PyInstaller --clean --noconfirm --onefile --collect-submodules midealocal --collect-submodules pymelcloud --collect-submodules aiomelcloudhome --collect-submodules thinqconnect --collect-submodules pymitsubishi --collect-submodules toshiba_ac --collect-submodules azure.iot.device --collect-submodules greeclimate_davo22 --collect-submodules aio_panasonic_comfort_cloud --collect-submodules aiomqtt --name klimat-adapter --distpath src-tauri/python/dist src-tauri/python/adapter_cli.py

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux and Windows installers
        if: runner.os != 'macOS'
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"
        shell: bash

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          stage="$(mktemp -d)"
          app="src-tauri/target/release/bundle/macos/Klimat.app"
          bundle_dir="src-tauri/target/release/bundle/dmg"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          case "$TARGET" in
            macos-arm64) arch="aarch64" ;;
            macos-x64) arch="x64" ;;
            *) echo "Unsupported macOS target: $TARGET" >&2; exit 1 ;;
          esac
          mkdir -p "$bundle_dir"
          cp -R "$app" "$stage/Klimat.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Klimat" -srcfolder "$stage" -ov -format UDZO "$bundle_dir/Klimat_${version}_${arch}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: klimat-${{ matrix.target }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          versions = {
              "tag": os.environ["RELEASE_TAG"].removeprefix("v"),
              "package.json": json.loads(Path("package.json").read_text())["version"],
              "Cargo.toml": tomllib.loads(Path("src-tauri/Cargo.toml").read_text())["package"]["version"],
              "tauri.conf.json": json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release tag and app versions must match: {versions}")
          print(f"Release version verified: {versions['tag']}")
          PY

      - name: Collect third-party license notices
        run: |
          python -m pip install -r requirements-adapters.txt
          python src-tauri/python/collect_licenses.py

      - uses: actions/download-artifact@v4
        with:
          pattern: klimat-*
          path: release-artifacts

      - name: Prepare release files and checksums
        run: |
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -exec cp '{}' release-assets/ \;
          cp src-tauri/python/dist/THIRD_PARTY_LICENSES.txt release-assets/
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -ge 6
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Publish early-access release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "Klimat $GITHUB_REF_NAME" --generate-notes --prerelease
