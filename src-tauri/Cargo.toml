[package]
name = "tauri-app"
version = "0.1.7"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Prefer StatusNotifierItem on Linux. KDE supports it natively and GNOME exposes it through
# the AppIndicator/KStatusNotifierItem shell extension, including activation events.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.5.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
gree-climate = "0.1"
tokio = { version = "1", features = ["net", "rt", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
